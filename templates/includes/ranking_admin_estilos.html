{# Estilos del Ranking que solo ve el administrador: dinero, cuadre, equipos y Caja. #}
<style>
    .stat-card .nota {
        margin-top: 6px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--text-muted);
    }
    .stat-card.bodegaje { border-left-color: #7c3aed; }
    .stat-card.bodegaje .value { color: #7c3aed; }
    .stat-card.bodegaje.sin-cobrar { border-left-color: var(--warning); }
    .stat-card.bodegaje.sin-cobrar .value { color: var(--warning); }
    .stat-card.bodegaje.perdonado { border-left-color: var(--text-muted); }
    .stat-card.bodegaje.perdonado .value { color: var(--text-soft); }
    [data-theme="dark"] .stat-card.bodegaje:not(.sin-cobrar):not(.perdonado) { border-left-color: #a78bfa; }
    [data-theme="dark"] .stat-card.bodegaje:not(.sin-cobrar):not(.perdonado) .value { color: #c4b5fd; }

    .fila-titulo {
        margin: -8px 0 8px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .5px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .chip-enlace {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 40px;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
    }
    .chip-enlace.caja-enlace { background: #fef3c7; color: #92400e; }
    .chip-enlace.ok { background: #dcfce7; color: #166534; }
    .chip-enlace.mal { background: #fee2e2; color: #991b1b; }
    [data-theme="dark"] .chip-enlace.caja-enlace { background: rgba(245, 158, 11, .18); color: #fcd34d; }
    [data-theme="dark"] .chip-enlace.ok { background: rgba(16, 185, 129, .18); color: #6ee7b7; }
    [data-theme="dark"] .chip-enlace.mal { background: rgba(239, 68, 68, .18); color: #fca5a5; }

    /* ── Dinero de la tarjeta del técnico ── */
    .dinero .separador { padding-top: 8px; border-top: 1px dashed var(--border-color); }
    .dinero dd.a-favor { color: var(--success); }
    .dinero dd.plus { color: #7c3aed; }
    [data-theme="dark"] .dinero dd.plus { color: #c4b5fd; }

    /* ── Equipos de cada técnico ── */
    /* La tabla ancha se desplaza dentro de su tarjeta, sin ensanchar la página. */
    .tech-list { grid-template-columns: minmax(0, 1fr); }
    .tech-card { min-width: 0; }
    .equipos-tecnico {
        min-width: 0;
        max-width: 100%;
        margin-top: 12px;
        padding: 14px;
        border-radius: 12px;
        background: var(--bg-soft, rgba(127, 127, 127, .06));
    }
    .equipos-tecnico > summary {
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        color: var(--text-main);
    }
    .equipos-tecnico .tabla-scroll { margin-top: 12px; }
    .tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tabla-admin {
        width: 100%;
        min-width: 1080px;
        border-collapse: collapse;
        font-size: 12px;
    }
    .tabla-admin th {
        padding: 9px 10px;
        text-align: right;
        font-size: 10.5px;
        letter-spacing: .3px;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--text-muted);
        border-bottom: 2px solid var(--border-color);
    }
    .tabla-admin td {
        padding: 9px 10px;
        text-align: right;
        white-space: nowrap;
        color: var(--text-main);
        border-bottom: 1px solid var(--border-color);
    }
    .tabla-admin th.texto, .tabla-admin td.texto { text-align: left; }
    .tabla-admin td.texto { white-space: normal; min-width: 90px; }
    .tabla-admin tfoot td { font-weight: 800; border-top: 2px solid var(--border-color); border-bottom: 0; }
    .tabla-admin a { color: var(--primary); font-weight: 800; }
    .tabla-admin .negativo { color: var(--danger); }
    .tabla-admin .positivo { color: var(--success); }
    .tabla-admin .plus { color: #7c3aed; font-weight: 800; }
    .tabla-admin .por-cobrar { color: #c2410c; font-weight: 800; }
    [data-theme="dark"] .tabla-admin .plus { color: #c4b5fd; }
    [data-theme="dark"] .tabla-admin .por-cobrar { color: #fdba74; }
    .bodegaje-estado {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 800;
    }
    .bodegaje-estado.cobrado { background: #ede9fe; color: #5b21b6; }
    .bodegaje-estado.pendiente { background: #fef3c7; color: #92400e; }
    .bodegaje-estado.perdonado { background: #e5e7eb; color: #374151; }
    .bodegaje-estado.sin { background: transparent; color: var(--text-muted); padding-left: 0; }
    [data-theme="dark"] .bodegaje-estado.cobrado { background: rgba(167, 139, 250, .18); color: #c4b5fd; }
    [data-theme="dark"] .bodegaje-estado.pendiente { background: rgba(245, 158, 11, .18); color: #fcd34d; }
    [data-theme="dark"] .bodegaje-estado.perdonado { background: rgba(255, 255, 255, .1); color: #d6d3d1; }

    /* ── Cuadre con Pagos ── */
    .cuadre-lista { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .cuadre-item {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
    }
    .cuadre-item.diferencia { border-color: #fca5a5; background: rgba(239, 68, 68, .07); }
    .cuadre-item.aviso { border-color: #fcd34d; background: rgba(245, 158, 11, .08); }
    .cuadre-marca {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        background: var(--success);
    }
    .cuadre-item.diferencia .cuadre-marca { background: var(--danger); }
    .cuadre-item.aviso .cuadre-marca { background: var(--warning); }
    .cuadre-titulo { font-size: 13px; font-weight: 800; color: var(--text-main); }
    .cuadre-cuenta { margin-top: 3px; font-size: 12px; font-weight: 600; color: var(--text-soft); overflow-wrap: anywhere; }
    .cuadre-causa { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--text-main); }
    .cuadre-diferencia { font-size: 14px; font-weight: 800; white-space: nowrap; color: var(--danger); }
    .cuadre-item.aviso .cuadre-diferencia { color: var(--warning); }
    .cuadre-ok { margin-top: 12px; }
    .cuadre-ok > summary { cursor: pointer; font-size: 13px; font-weight: 800; color: var(--success); margin-bottom: 10px; }
    .cuadre-resumen { margin: 0 0 14px; font-size: 13px; font-weight: 700; color: var(--text-soft); }

    /* ── Caja ── */
    .caja {
        --caja-metal: linear-gradient(145deg, #5f6b78 0%, #3c4552 55%, #2c333d 100%);
        --caja-puerta: linear-gradient(145deg, #707d8c 0%, #4a5462 60%, #38414d 100%);
        --caja-borde: #252b33;
        --caja-interior: #171b21;
        --caja-oro: #f59e0b;
        --caja-oro-claro: #fde68a;
        --caja-oro-oscuro: #b45309;
        --caja-suave: rgba(245, 158, 11, .1);
        scroll-margin-top: 90px;
    }
    [data-theme="dark"] .caja {
        --caja-metal: linear-gradient(145deg, #7a8796 0%, #535e6c 55%, #3f4955 100%);
        --caja-puerta: linear-gradient(145deg, #8b98a7 0%, #5e6a79 60%, #4a5563 100%);
        --caja-borde: #1a1e24;
        --caja-suave: rgba(245, 158, 11, .14);
    }
    .caja-principal {
        display: grid;
        grid-template-columns: minmax(230px, 280px) minmax(0, 1fr);
        gap: 28px;
        align-items: center;
    }
    .caja-escena {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0 4px;
    }
    .caja-fuerte {
        position: relative;
        width: 210px;
        height: 210px;
        padding: 14px;
        border-radius: 16px;
        background: var(--caja-metal);
        border: 2px solid var(--caja-borde);
        box-shadow: 0 16px 26px -12px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .22);
    }
    .caja-interior {
        position: relative;
        height: 100%;
        border-radius: 8px;
        overflow: hidden;
        background: var(--caja-interior);
        box-shadow: inset 0 6px 14px rgba(0, 0, 0, .75);
    }
    .caja-monedas {
        position: absolute;
        inset: auto 8px 8px;
        display: flex;
        flex-wrap: wrap-reverse;
        justify-content: center;
        gap: 3px;
    }
    .caja-moneda {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        font-size: 13px;
        font-weight: 900;
        color: var(--caja-oro-oscuro);
        background: radial-gradient(circle at 34% 30%, var(--caja-oro-claro), var(--caja-oro) 62%, var(--caja-oro-oscuro) 100%);
        box-shadow: inset 0 0 0 2px rgba(180, 83, 9, .45), 0 2px 3px rgba(0, 0, 0, .5);
    }
    .caja-moneda.nueva { animation: caja-rebote .38s ease-out; }
    .caja-moneda-vuelo {
        position: fixed;
        z-index: 40;
        left: 0;
        top: 0;
        pointer-events: none;
    }
    @keyframes caja-rebote {
        0% { transform: translateY(-14px) scale(.9); }
        60% { transform: translateY(2px) scale(1.06); }
        100% { transform: none; }
    }
    .caja-puerta {
        position: absolute;
        inset: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: var(--caja-puerta);
        border: 2px solid var(--caja-borde);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 3px 4px 10px rgba(0, 0, 0, .35);
        transform-origin: left center;
        transition: transform .62s cubic-bezier(.65, .05, .3, 1);
    }
    .caja.abierta .caja-puerta { transform: perspective(1100px) rotateY(-97deg); }
    .caja-puerta::before, .caja-puerta::after {
        content: '';
        position: absolute;
        left: -8px;
        width: 12px;
        height: 28px;
        border-radius: 4px;
        background: #222831;
    }
    .caja-puerta::before { top: 24px; }
    .caja-puerta::after { bottom: 24px; }
    .caja-dial {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #e2e8f0, #94a3b8 60%, #475569 100%);
        box-shadow: 0 4px 8px rgba(0, 0, 0, .45), inset 0 0 0 6px rgba(15, 23, 42, .25);
    }
    .caja-dial::before, .caja-dial::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 58px;
        height: 9px;
        margin: -4.5px 0 0 -29px;
        border-radius: 5px;
        background: #334155;
    }
    .caja-dial::after { transform: rotate(90deg); }
    .caja.cerrando .caja-dial { animation: caja-dial 1s cubic-bezier(.3, .7, .3, 1); }
    @keyframes caja-dial {
        0% { transform: rotate(0); }
        55% { transform: rotate(250deg); }
        100% { transform: rotate(180deg); }
    }
    .caja-luz {
        position: absolute;
        right: 14px;
        top: 14px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px #22c55e;
    }
    .caja.abierta .caja-luz { background: var(--caja-oro); box-shadow: 0 0 8px var(--caja-oro); }
    .caja-patas { display: flex; justify-content: space-between; width: 170px; }
    .caja-patas span { width: 28px; height: 9px; border-radius: 0 0 5px 5px; background: var(--caja-borde); }

    .caja-saldo-etiqueta {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .5px;
        text-transform: uppercase;
        color: var(--text-muted);
    }
    .caja-saldo {
        font-size: clamp(32px, 6vw, 46px);
        font-weight: 900;
        line-height: 1.1;
        color: var(--caja-oro-oscuro);
        font-variant-numeric: tabular-nums;
    }
    [data-theme="dark"] .caja-saldo { color: var(--caja-oro); }
    .caja-saldo.negativo { color: var(--danger); }
    .caja-saldo-nota { margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .caja-cuentas {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
        margin: 16px 0;
    }
    .caja-cuentas dt { font-size: 11px; font-weight: 800; color: var(--text-muted); }
    .caja-cuentas dd { font-size: 16px; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums; }
    .caja-cuentas dd.entra { color: var(--success); }
    .caja-cuentas dd.sale { color: var(--danger); }
    .caja-metodos { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .caja-metodos li {
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 800;
        color: var(--text-soft);
        background: var(--caja-suave);
    }
    .caja-metodos b { color: var(--text-main); }
    .caja-repetir {
        margin-top: 14px;
        min-height: 40px;
        padding: 8px 14px;
        border: 1px solid var(--border-color);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        color: var(--text-main);
        background: transparent;
        cursor: pointer;
    }
    .caja-repetir:hover { border-color: var(--caja-oro); }
    /* Oculto conserva su espacio: el resumen no salta al terminar la animación. */
    .caja-repetir[hidden] { display: inline-block; visibility: hidden; }

    .caja-meses {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        margin: 22px 0 18px;
        padding: 0;
        list-style: none;
    }
    .caja-mes {
        position: relative;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--caja-suave);
        transition: opacity .25s, transform .25s, box-shadow .25s, border-color .25s;
    }
    .caja-mes.actual { border: 2px solid var(--caja-oro); }
    .caja-mes-nombre { display: block; font-size: 12px; font-weight: 800; color: var(--text-main); }
    .caja-mes-neto { display: block; margin-top: 3px; font-size: 17px; font-weight: 900; color: var(--success); font-variant-numeric: tabular-nums; }
    .caja-mes-neto.negativo { color: var(--danger); }
    .caja-mes-neto.cero { color: var(--text-muted); }
    .caja-mes-guardado { display: block; margin-top: 2px; font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .caja-mes-sello {
        position: absolute;
        right: 10px;
        top: 10px;
        font-size: 13px;
        font-weight: 900;
        color: var(--success);
    }
    .caja.animando .caja-mes { opacity: .45; }
    .caja.animando .caja-mes .caja-mes-sello { opacity: 0; }
    .caja.animando .caja-mes.activo {
        opacity: 1;
        transform: translateY(-3px);
        border-color: var(--caja-oro);
        box-shadow: 0 8px 16px -8px rgba(245, 158, 11, .7);
    }
    .caja.animando .caja-mes.guardado { opacity: 1; }
    .caja.animando .caja-mes.guardado .caja-mes-sello { opacity: 1; }

    .caja-detalle .tabla-admin { min-width: 780px; }
    .caja-detalle .tabla-admin td.texto { white-space: nowrap; }
    .caja-aclaracion { margin: 12px 0 0; font-size: 12px; font-weight: 700; color: var(--text-muted); line-height: 1.45; }

    @media (max-width: 720px) {
        .caja-principal { grid-template-columns: minmax(0, 1fr); gap: 16px; }
        .caja-resumen { text-align: center; }
        .caja-metodos { justify-content: center; }
        .caja-cuentas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .caja-meses { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .cuadre-item { grid-template-columns: 26px minmax(0, 1fr); }
        .cuadre-diferencia { grid-column: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
        .caja-puerta, .caja-mes { transition: none; }
        .caja-moneda.nueva, .caja.cerrando .caja-dial { animation: none; }
    }
</style>
