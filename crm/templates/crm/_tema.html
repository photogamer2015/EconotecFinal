<script>
/* Tema antes de pintar la página (sin parpadeo). Usa la misma preferencia que Econotec («theme»). */
(function () {
  var t = "auto";
  try { t = localStorage.getItem("theme") || "auto"; } catch (e) {}
  var oscuro = t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", oscuro ? "dark" : "light");
  document.documentElement.setAttribute("data-tema-pref", t);
})();
</script>
